name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changed-packages:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: List packages to verify
        id: packages
        env:
          # PRs are checked out as a merge commit, whose first parent is the base branch.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          paths=('Casks/*.rb' 'Formula/*.rb')
          if git diff --quiet "$BASE" HEAD -- .github/workflows/check.yml; then
            packages=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- "${paths[@]}")
          else
            # The check itself changed, so verify all packages.
            packages=$(git ls-files -- "${paths[@]}")
          fi
          matrix="[$(printf '%s' "$packages" | sed -E 's|.*/(.*)\.rb|"\1"|' | paste -sd, -)]"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  verify-packages:
    needs:
      - changed-packages
    if: ${{ needs.changed-packages.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        packages: ${{ fromJSON(needs.changed-packages.outputs.matrix) }}
        os: # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
          - macos-latest # Based on arm64.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Homebrew Tap
        run: |
          brew update-reset "$(brew --repository)"
          TAP_BASE=$(brew --taps)/${{ github.repository_owner }}
          mkdir -vp $TAP_BASE
          ln -vs $GITHUB_WORKSPACE $TAP_BASE/${{ github.event.repository.name }}
          brew trust $GITHUB_REPOSITORY
      - name: Check Package
        env:
          PACKAGE_NAME: ${{ matrix.packages }}
        run: |
          README_FILE="README.md"
          if ! grep -qi -- "\`$PACKAGE_NAME\`" "$README_FILE"; then
            echo "Package \`$PACKAGE_NAME\` not found in \`$README_FILE\`"
            exit 1
          fi

          printf "\033[32m==>\033[0m \033[1;30mLinting\033[0m \033[1;32m%s\033[0m\n" "$PACKAGE_NAME"
          brew style "$PACKAGE_NAME"
          printf "\033[32m==>\033[0m \033[1;30mAuditing\033[0m \033[1;32m%s\033[0m\n" "$PACKAGE_NAME"
          brew audit --strict "$PACKAGE_NAME"
          brew install "$PACKAGE_NAME"
          brew uninstall "$PACKAGE_NAME"

  # Status check that is required in branch protection rules.
  final-status:
    needs:
      - changed-packages
      - verify-packages
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Write GitHub context to log
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: Check
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs completed successfully."
