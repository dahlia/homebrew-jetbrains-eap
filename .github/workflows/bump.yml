name: Bump

on:
  schedule:
    # Run every hour.
    - cron: "0 * * * *"
  workflow_dispatch:
  workflow_call:

jobs:
  bump:
    runs-on: ubuntu-slim
    if: github.event.repository.fork == false
    # For `GITHUB_TOKEN` to enable auto-merge; pushing and opening PRs use the PAT.
    permissions:
      contents: write
      pull-requests: write
    # Job-level, so it also applies when called from `check.yml` via `workflow_call`.
    concurrency:
      group: bump
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }} # A PAT for hong-bot which will trigger workflows run.
      - name: Set up Git
        run: |
          git config --global user.name 'HongBot'
          git config --global user.email '109153616+hong-bot@users.noreply.github.com'
      - name: Bump packages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # A PAT for hong-bot which will trigger workflows run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Used to enable auto-merge, which will not trigger workflows run when merged.
        run: .github/scripts/bump.py
